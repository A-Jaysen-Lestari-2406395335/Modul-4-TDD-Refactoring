<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Pay Order</h3>
    <p th:if="${order != null}">
        Order ID: <span th:text="${order.id}"></span>
    </p>

    <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
        <div class="form-group">
            <label for="methodInput">Method</label>
            <input id="methodInput" name="method" type="text" class="form-control mb-3 col-6"
                   placeholder="Voucher Code or Cash on Delivery">
        </div>
        <div class="form-group">
            <label for="voucherCodeInput">Voucher Code</label>
            <input id="voucherCodeInput" name="voucherCode" type="text" class="form-control mb-3 col-6"
                   placeholder="Optional for voucher">
        </div>
        <div class="form-group">
            <label for="addressInput">Address</label>
            <input id="addressInput" name="address" type="text" class="form-control mb-3 col-6"
                   placeholder="Optional for COD">
        </div>
        <div class="form-group">
            <label for="deliveryFeeInput">Delivery Fee</label>
            <input id="deliveryFeeInput" name="deliveryFee" type="text" class="form-control mb-4 col-6"
                   placeholder="Optional for COD">
        </div>

        <button id="payButton" type="submit" class="btn btn-primary">Pay</button>
    </form>
</div>
</body>
</html>
